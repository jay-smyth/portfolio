# Separate project name so this never collides with Sail's containers or volumes.
name: asa-services-devcontainer

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - '..:/workspace:cached'
        # Keep the container running; VS Code attaches and you start the app yourself.
        command: sleep infinity
        depends_on:
            mysql:
                condition: service_healthy

    # Credentials match the DB_* defaults in .env.example.
    mysql:
        image: 'mysql:8.4'
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: laravel
            MYSQL_USER: sail
            MYSQL_PASSWORD: password
        volumes:
            - 'mysql-data:/var/lib/mysql'
            - './mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        healthcheck:
            # TCP (not the socket) so it only passes once MySQL's init phase is done.
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ppassword']
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql-data:
